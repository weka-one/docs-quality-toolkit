# Vale configuration for the TikTok for Developers docs style linter.
#
# StylesPath is relative to this file. Runs from the repository root should use
# `vale --config=docs-style-linter/.vale.ini`; the Makefile and the GitHub
# Action both do this for you.

StylesPath = styles
MinAlertLevel = suggestion

# `Vocab` is intentionally unset. Vale's vocabulary is a global alert filter,
# not just a spelling dictionary: an accepted term suppresses every rule that
# matches it. Accepting `API` silently disabled ApiKeyCase entirely. The
# accepted vocabulary lives in styles/vocabulary/accept.txt and is compiled
# into per-rule exceptions by tools/sync_vocab.py.


# Treat MDX as Markdown. Vale's Markdown scoping understands fenced code
# blocks, inline code spans, and link syntax, so rules written against
# `scope: text` never fire inside a code sample.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = TikTokDocs

# JSX/MDX component tags are not prose. Vale's Markdown parser leaves them in
# the text stream, so drop them before any rule sees them.
TokenIgnores = (<\/?[A-Z][A-Za-z0-9]*(\s[^>]*)?\/?>), (\{\/\*.*?\*\/\})

# Frontmatter is metadata, not prose.
# MDX import/export statements are code that Vale's Markdown parser hands back
# as text. Left in, the file paths inside them dominate any rule that looks at
# punctuation: `ForwardSlash` scored 195 on this corpus, 164 of which were the
# single path `snippets/generated`.
BlockIgnores = (?s) *(---\n.*?\n---), (?m)^import\s+.*$, (?m)^export\s+.*$
