# Source: Google developer documentation style guide, "Abbreviations".
# Rationale: an undefined initialism is invisible to a newcomer and unsearchable.
# The exceptions list is the set assumed known to any developer reading a
# platform API reference — it is deliberately generous, because a noisy version
# of this rule gets switched off.
extends: conditional
message: "'%s' is used without being defined on this page."
link: https://developers.google.com/style/abbreviations
level: suggestion
scope: text
ignorecase: false
first: '\b([A-Z]{3,5})\b'
second: '(?:\b[A-Za-z][A-Za-z.-]+[ ]){1,5}\(([A-Z]{3,5})\)'
exceptions:
