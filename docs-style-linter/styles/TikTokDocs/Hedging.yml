# Source: Microsoft Writing Style Guide, "Word choice"; RFC 2119 keyword
# discipline applied to prose.
# Rationale: "should" leaves a reader unable to tell a requirement from advice.
# Use the imperative for required steps and "we recommend"-free phrasing for
# optional ones.
extends: existence
message: "'%s' is ambiguous — say whether the step is required (imperative) or optional."
level: suggestion
ignorecase: true
tokens:
  - "you should"
  - "you may want to"
  - "you might want to"
  - "it is recommended"
  - "it's recommended"
