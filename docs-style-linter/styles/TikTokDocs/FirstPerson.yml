# Source: TT4D style guide, Grammatical person > First person.
# First person is acceptable in blog posts, where TikTok is the speaker;
# exclude blog paths in .vale.ini rather than lowering this level.
# Rationale: reference documentation describes a product, not a team. First
# person also becomes wrong the moment the doc is syndicated or white-labelled.
extends: existence
message: "Avoid first person ('%s'). Name the product or use second person."
link: https://developers.google.com/style/person
level: warning
ignorecase: true
tokens:
  - "we'll"
  - "we've"
  - "we're"
  - "let's"
  - 'we recommend'
  - 'our recommendation'
  - 'in our experience'
