# Fixture suite for the TikTokDocs Vale package.
#
# Every rule must prove two things: it fires on prose that violates it, and it
# stays silent on prose that does not. The `good` cases matter more than the
# `bad` ones — a rule with no negative cases is indistinguishable from a rule
# that flags everything.
#
# Run with: make test   (tools/ruletest.py)
#
# Each snippet is materialised as its own .mdx file so that page-scoped checks
# (Acronyms) and heading-scoped checks cannot leak across cases.
#
# Three categories:
#   bad       - must produce an alert
#   good      - must produce no alert
#   known_fp  - a documented false positive. The rule fires and we have decided
#               to live with it. The runner asserts these still fire; if one
#               stops, the limitation has been fixed and the case should be
#               promoted to `good`. Recording these keeps the rule set honest:
#               a linter with no known false positives has not been measured.

TikTokDocs.Filler:
  bad:
    - "Simply run the command to start the server."
    - "You can easily add a document to the index."
    - "Obviously, the token expires after an hour."
  good:
    - "Run the command to start the server."
    - "The token expires after an hour."

TikTokDocs.Please:
  bad:
    - "Please run the migration before you upgrade."
  good:
    - "Run the migration before you upgrade."
    - "The endpoint returns a pleasing summary of the index."

TikTokDocs.FirstPerson:
  bad:
    - "We recommend batching documents in groups of 1000."
    - "We'll cover pagination in the next section."
  good:
    - "Batch documents in groups of 1000."
    - "The next section covers pagination."

