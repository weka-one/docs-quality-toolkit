TikTokDocs.HTTPMethodCase:
  bad:
    - "Send a get /indexes request to list every index."
    - "Issue a post request to create the index."
  good:
    - "Send a GET /indexes request to list every index."
    - "Issue a POST request to create the index."
  known_fp:
    - text: "The client will get /indexes wrong if you lowercase it in code samples."
      why: >-
        'get' here is the English verb, not the HTTP method, but it is still
        followed by a path. Separating the two needs part-of-speech tagging,
        which Vale does not do. Accepted: the rule is an error-level regression
        guard and the corpus contains zero real instances, so the cost of a rare
        false positive is lower than the cost of a lowercase verb reaching a
        reader who copies it.

