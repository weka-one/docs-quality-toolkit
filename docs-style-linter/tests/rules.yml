TikTokDocs.SentenceLength:
  bad:
    - "The search endpoint accepts a query string and a set of optional filters and a sort order and a pagination cursor and a list of attributes to retrieve and a list of attributes to highlight and a matching strategy, all of which interact in ways that are documented separately."
  good:
