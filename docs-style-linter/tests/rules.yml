    - "| Field | Type |\n| --- | --- |\n| `flag` | bool |"
  good:
    - "| Field | Type |\n| --- | --- |\n| `limit` | `int64` |"
    - "| Field | Type |\n| --- | --- |\n| `flag` | `Boolean` |"
    - "Pass an integer value to the endpoint."

