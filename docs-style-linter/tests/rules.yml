TikTokDocs.Acronyms:
  bad:
    - "Route the request through the CDW before indexing."
  good:
    - "Route the request through the content delivery warehouse (CDW) before indexing."
    - "The API returns JSON over HTTPS and the SDK wraps it."
    - "Filter with AND and OR operators."
