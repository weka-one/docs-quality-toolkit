    - "Authenticate with OAuth 2.0 before calling the endpoint."

TikTokDocs.ApiKeyCase:
  bad:
    - "Copy the API Key from the dashboard."
    - "Your Access Token expires in one hour."
    - "Regenerate the Api key if it leaks."
  good:
    - "Copy the API key from the dashboard."
    - "Your access token expires in one hour."
    - "Regenerate the API key if it leaks."

TikTokDocs.HTTPMethodCase:
  bad:
    - "Send a get /indexes request to list every index."
    - "Issue a post request to create the index."
  good:
    - "Send a GET /indexes request to list every index."
    - "Issue a POST request to create the index."
  known_fp:
    - text: "The client will get /indexes wrong if you lowercase it in code samples."
      why: >-
        'get' here is the English verb, not the HTTP method, but it is still
        followed by a path. Separating the two needs part-of-speech tagging,
        which Vale does not do. Accepted: the rule is an error-level regression
        guard and the corpus contains zero real instances, so the cost of a rare
        false positive is lower than the cost of a lowercase verb reaching a
        reader who copies it.

TikTokDocs.EndpointInCode:
  bad:
    - "Call /indexes/movies/documents to add records."
    - "The route /v1/tasks/cancel stops a running task."
  good:
    - "Call `/indexes/movies/documents` to add records."
    - "The route `/v1/tasks/cancel` stops a running task."

TikTokDocs.StatusCodeName:
  bad:
    - "A missing index returns 404 not found."
    - "An expired key returns 401 unauthorized."
  good:
    - "A missing index returns 404 Not Found."
    - "An expired key returns 401 Unauthorized."

TikTokDocs.CurlyQuotes:
  bad:
    - "Set the index’s primary key before indexing."
    - "The docs call this a “searchable attribute”."
  good:
    - "Set the index's primary key before indexing."
    - "The docs call this a \"searchable attribute\"."

