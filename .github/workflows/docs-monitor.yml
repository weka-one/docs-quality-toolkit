name: Docs monitor

# The docs this is aimed at live in a CMS, not in Git, so there is no pull
# request to gate. GitHub Actions is still the runner - it just runs on a
# schedule against the CMS and reports the delta since the last run.
#
# The job fails on NEW error-level findings, never on the standing backlog. A
# monitor that fails every morning because of work nobody has started yet is a
# monitor everyone mutes.

on:
  schedule:
    - cron: "0 6 * * 1-5"   # 06:00 UTC on weekdays
  workflow_dispatch:
    inputs:
      config:
        description: "Config file to run"
        default: config.demo.yml

permissions:
  contents: read

jobs:
  monitor:
    name: Check published documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --quiet -r docs-pipeline/requirements.txt
          python -m pip install --quiet -r docs-freshness/requirements.txt

      - name: Install Vale
        run: |
          set -euo pipefail
          SHA="dd8519d9bdf381a3b1a30f1df7f6e589b69ec1e38a495e4bd9af8e450703dde0"
          TARBALL="vale_3.9.6_Linux_64-bit.tar.gz"
          curl -sSLf --retry 3 \
            "https://github.com/errata-ai/vale/releases/download/v3.9.6/${TARBALL}" -o "$TARBALL"
          echo "${SHA}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" vale
          sudo install -m 0755 vale /usr/local/bin/vale

      # The previous run's snapshot is what "new since last time" is measured
      # against. Cached rather than committed: the history is an artifact of
      # running, not source.
      - name: Restore run history
        uses: actions/cache/restore@v4
        with:
          path: docs-pipeline/history
          key: docs-monitor-history-${{ github.run_id }}
          restore-keys: docs-monitor-history-

      - name: Run the monitor
        id: monitor
        working-directory: docs-pipeline
        env:
          # Supplied as a repository secret; never committed.
          DOCS_CMS_TOKEN: ${{ secrets.DOCS_CMS_TOKEN }}
        run: python pipeline/run.py --config "${{ inputs.config || 'config.demo.yml' }}"

      - name: Build the report
        if: always()
        working-directory: docs-pipeline
        run: python pipeline/dashboard.py --history history --out reports/dashboard.html

      - name: Save run history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: docs-pipeline/history
          key: docs-monitor-history-${{ github.run_id }}

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-health-report
          path: |
            docs-pipeline/reports/dashboard.html
            docs-pipeline/reports/latest.json
          retention-days: 90

      - name: Summarise
        if: always()
        working-directory: docs-pipeline
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = json.loads(pathlib.Path("reports/latest.json").read_text())
          delta = d.get("delta", {})
          print(f"## Documentation health\n")
          print(f"**{d['total']}** open finding(s) across {d['pages']} pages.\n")
          print("| Severity | Count |\n| --- | ---: |")
          for level in ("error", "warning", "suggestion"):
              print(f"| {level} | {d['by_level'].get(level, 0)} |")
          if delta.get("first_run"):
              print("\nFirst run - no baseline yet.")
          else:
              print(f"\n{len(delta.get('new', []))} new, {len(delta.get('fixed', []))} fixed "
                    f"since {delta.get('previous_timestamp', '')}.")
              for fp in delta.get("new", [])[:20]:
                  print(f"- `{fp}`")
          print("\nFull report: the `docs-health-report` artifact on this run.")
          PY
