# Publishes the site to GitHub Pages, but only when the quality gate
# passes — a broken internal link or a terminology error fails the run
# and the live site keeps serving the last good version.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue them instead of cancelling, so the
# last push always ends up being the one that is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the quality gate
        run: node scripts/check.mjs

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Ship the site only. The scripts, the workflows and the README
      # stay in the repo and off the web server.
      - name: Stage the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets portfolio _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
