name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VALE_VERSION: "3.9.6"

jobs:
  linter:
    name: Style rule package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Install Vale
        run: |
          set -euo pipefail
          SHA="dd8519d9bdf381a3b1a30f1df7f6e589b69ec1e38a495e4bd9af8e450703dde0"
          TARBALL="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -sSLf --retry 3 \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${TARBALL}" \
            -o "$TARBALL"
          echo "${SHA}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" vale
          sudo install -m 0755 vale /usr/local/bin/vale
          vale --version

      - name: Rule fixtures
        run: python docs-style-linter/tools/ruletest.py

      - name: Remediation is reproducible
        working-directory: docs-style-linter
        run: |
          python tools/remediate.py \
            --src ../corpus/meilisearch-docs --dst build/after \
            --json build/remediation.json

      - name: Remediation never edits a code sample
        working-directory: docs-style-linter
        run: python tools/verify_codeblocks.py ../corpus/meilisearch-docs build/after

      - name: Structural checks run clean against their own policy
        working-directory: docs-style-linter
        run: |
          python tools/structure_lint.py ../corpus/meilisearch-docs \
            --config config/evaluation-corpus.yml --out build/structure.md > /dev/null
          if ! diff -u reports/structure.md build/structure.md; then
            echo "::error::reports/structure.md is stale. Run 'make structure' and commit it."
            exit 1
          fi

      - name: Structural policy files are valid
        working-directory: docs-style-linter
        run: |
          for cfg in config/*.yml; do
            python tools/structure_lint.py ../corpus/meilisearch-docs --config "$cfg" > /dev/null
          done

      - name: Committed before/after metrics are current
        working-directory: docs-style-linter
        run: |
          python tools/report.py \
            --before ../corpus/meilisearch-docs --after build/after \
            --out-md build/before-after.md > /dev/null
          if ! diff -u reports/before-after.md build/before-after.md; then
            echo "::error::reports/before-after.md is stale. Run 'make report' and commit the result."
            exit 1
          fi

  freshness:
    name: Docs freshness checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet --disable-pip-version-check -r docs-freshness/requirements.txt

      - name: Unit tests
        run: python -m pytest docs-freshness/tests -q

      - name: Evaluation harness meets its committed thresholds
        run: python docs-freshness/eval/harness.py --check-thresholds

      - name: Committed evaluation report is current
        working-directory: docs-freshness
        run: |
          python eval/harness.py --out-md /tmp/eval.md > /dev/null
          if ! diff -u eval/results/latest.md /tmp/eval.md; then
            echo "::error::eval/results/latest.md is stale. Run 'make eval' and commit the result."
            exit 1
          fi

      - name: Seeded drift set reproduces exactly
        working-directory: docs-freshness
        run: |
          cp eval/mutations.jsonl /tmp/mutations.before
          python eval/mutations.py --count 20 > /dev/null
          if ! diff -u /tmp/mutations.before eval/mutations.jsonl; then
            echo "::error::mutations.py is no longer deterministic for its seed."
            exit 1
          fi
